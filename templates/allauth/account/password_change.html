{% extends "account/base.html" %}

{% load i18n %}

{% block head_title %}{% trans "Change Password" %}{% endblock %}

{% block content %}
<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-7">
      <div class="card shadow border-primary">
        <div class="card-body">
          <h1 class="text-primary text-center mb-4">{% trans "Change Password" %}</h1>

          <form method="POST" action="{% url 'account_change_password' %}" class="needs-validation">
            {% csrf_token %}

            <div class="mb-3">
              {{ form.as_p }}
            </div>

            <div class="d-flex justify-content-between flex-wrap mt-3">
              <button class="btn btn-primary mb-2" type="submit" name="action">
                {% trans "Change Password" %}
              </button>
              <a class="btn btn-link text-danger mb-2" href="{% url 'account_reset_password' %}">
                {% trans "Forgot Password?" %}
              </a>
            </div>
          </form>

        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
